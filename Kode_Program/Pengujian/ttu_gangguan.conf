# Konfigurasi Mosquitto untuk uji gangguan koneksi ke broker (skenario 13-15).
# Broker hanya mendengarkan di laptop sendiri (127.0.0.1) port 1884.
# Port 1883 dipakai logger.py --gangguan sebagai perantara untuk gateway,
# sehingga firmware gateway tidak perlu diubah.
# Jalankan:  "C:\Program Files\mosquitto\mosquitto.exe" -c ttu_gangguan.conf -v
listener 1884 127.0.0.1
allow_anonymous true
